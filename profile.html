<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心晴小站 - 个人信息</title>
    <link rel="stylesheet" href="css/style_main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e3eeff);
            min-height: 100vh;
            padding: 2rem;
        }

        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            padding: 3rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .profile-header h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .avatar-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin: 0 auto 1rem;
            display: block;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .avatar-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .avatar-upload {
            display: none;
        }

        .avatar-label {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .avatar-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .info-section {
            margin-bottom: 2rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #e0e7ff;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 500;
            color: #333;
        }

        .info-value {
            color: #666;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            color: #333;
            padding: 0.8rem 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: white;
            transform: translateY(-2px);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i> 返回首页
    </button>

    <div class="profile-container">
        <div class="profile-header">
            <h1><i class="fas fa-user-circle"></i> 个人信息</h1>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="avatar-section">
            <img id="avatarPreview" src="images/me.png" alt="头像" class="avatar-preview" onclick="document.getElementById('avatarUpload').click()">
            <input type="file" id="avatarUpload" class="avatar-upload" accept="image/*">
            <label for="avatarUpload" class="avatar-label">
                <i class="fas fa-camera"></i> 更换头像
            </label>
        </div>

        <div class="info-section">
            <div class="info-item">
                <span class="info-label">用户名</span>
                <span class="info-value" id="username"></span>
            </div>
            <div class="info-item">
                <span class="info-label">邮箱</span>
                <span class="info-value" id="email"></span>
            </div>
            <div class="info-item">
                <span class="info-label">注册时间</span>
                <span class="info-value" id="createdAt"></span>
            </div>
        </div>
    </div>

    <script>
        // 检查登录状态（本地模式，无需后端）
        const token = localStorage.getItem('token');
        const username = localStorage.getItem('username');
        if (!token || !username) {
            window.location.href = '/';
        }

        // 默认用户信息
        const defaultUserInfo = {
            username: '123456',
            email: '123456@example.com',
            createdAt: new Date('2024-01-01').toLocaleString('zh-CN')
        };

        // 加载用户信息（本地模式，无需后端）
        function loadUserInfo() {
            // 从localStorage读取用户名，如果没有则使用默认值
            const savedUsername = localStorage.getItem('username') || defaultUserInfo.username;
            
            // 初始化邮箱和注册时间（如果不存在则保存默认值）
            if (!localStorage.getItem('userEmail')) {
                localStorage.setItem('userEmail', defaultUserInfo.email);
            }
            if (!localStorage.getItem('userCreatedAt')) {
                localStorage.setItem('userCreatedAt', defaultUserInfo.createdAt);
            }
            
            const savedEmail = localStorage.getItem('userEmail');
            const savedCreatedAt = localStorage.getItem('userCreatedAt');
            
            // 显示用户信息
            document.getElementById('username').textContent = savedUsername;
            document.getElementById('email').textContent = savedEmail;
            document.getElementById('createdAt').textContent = savedCreatedAt;
            
            // 加载头像（从localStorage读取，如果没有则使用默认头像）
            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) {
                document.getElementById('avatarPreview').src = savedAvatar;
            } else {
                // 首次加载时，如果没有保存的头像，使用默认头像
                document.getElementById('avatarPreview').src = 'images/me.png';
            }
        }

        // 上传头像（本地存储，无需后端）
        document.getElementById('avatarUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                showError('请选择图片文件');
                return;
            }

            // 验证文件大小（限制5MB）
            if (file.size > 5 * 1024 * 1024) {
                showError('图片大小不能超过5MB');
                return;
            }

            // 使用FileReader将图片转为base64
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64Image = event.target.result;
                
                // 保存到localStorage
                localStorage.setItem('userAvatar', base64Image);
                
                // 更新头像预览
                document.getElementById('avatarPreview').src = base64Image;
                showSuccess('头像更新成功！');
            };
            
            reader.onerror = () => {
                showError('图片读取失败，请重试');
            };
            
            // 读取文件为Data URL（base64）
            reader.readAsDataURL(file);
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            setTimeout(() => {
                errorMsg.classList.remove('show');
            }, 3000);
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = message;
            successMsg.classList.add('show');
            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 3000);
        }

        function goBack() {
            window.location.href = '/';
        }

        // 页面加载时加载用户信息
        window.addEventListener('load', loadUserInfo);
    </script>
</body>
</html>
